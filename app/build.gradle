plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'ru.moistranicy.app'
    compileSdk 35

    defaultConfig {
        applicationId "ru.moistranicy.app"
        minSdk 26
        targetSdk 35
        // номер версии растёт с каждой сборкой в GitHub Actions — обновление ставится поверх
        def run = System.getenv("GITHUB_RUN_NUMBER")
        versionCode run != null ? 100 + run.toInteger() : 4
        versionName "0.5" + (run != null ? "." + run : "")
        // ClientID приложения в Яндекс OAuth (oauth.yandex.ru) — не секрет
        def yandexClientId = System.getenv("YANDEX_CLIENT_ID") ?: (project.findProperty("yandexClientId") ?: "")
        manifestPlaceholders = [YANDEX_CLIENT_ID: yandexClientId]
        buildConfigField "String", "YANDEX_CLIENT_ID", "\"${yandexClientId}\""
        // сборка для магазина (RuStore): без ссылок на скачивание FB2
        buildConfigField "boolean", "STORE_BUILD", (System.getenv("STORE_BUILD") == "1") ? "true" : "false"
        // адрес социального сервера (функция Яндекс Облака)
        def socialApiUrl = System.getenv("SOCIAL_API_URL") ?: (project.findProperty("socialApiUrl") ?: "")
        buildConfigField "String", "SOCIAL_API_URL", "\"${socialApiUrl}\""
    }
    signingConfigs {
        // постоянный отладочный ключ из репозитория: без него GitHub каждый раз
        // создаёт новый, и обновление не ставится поверх («конфликт с пакетом»)
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks != null && !ks.isEmpty()) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            def ks = System.getenv("KEYSTORE_FILE")
            signingConfig = (ks != null && !ks.isEmpty()) ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.navigation:navigation-compose:2.8.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'com.yandex.android:authsdk:3.1.3'
}
