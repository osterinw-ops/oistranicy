name: Telegram bot bridge
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: telegram-bridge
  cancel-in-progress: false
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::Нет секрета TELEGRAM_BOT_TOKEN — бот не настроен"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - name: Get bot state branch
        if: env.SKIP != '1'
        run: |
          git config user.name "moistranicy-bot"
          git config user.email "bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git clone --depth 1 --branch bot-state "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" state
          else
            mkdir state && cd state && git init -q -b bot-state
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          fi
      - name: Run bridge
        if: env.SKIP != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CODE: ${{ secrets.TELEGRAM_ADMIN_CODE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_DIR: state
        run: python3 .github/scripts/telegram_bridge.py
      - name: Save state
        if: env.SKIP != '1'
        run: |
          cd state
          git config user.name "moistranicy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "bot state"
            git push -q origin bot-state
          fi
