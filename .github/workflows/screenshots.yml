name: Store screenshots
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Профиль эмулятора (pixel_c — планшет, pixel_6 — телефон)'
        default: 'pixel_c'
      rotation:
        description: 'Поворот экрана: 0 — родной, 1 — повернуть на 90°'
        default: '1'
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        env:
          STORE_BUILD: "1"
        run: gradle assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.device }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ROTATION=${{ inputs.rotation }} OUT=screens bash .github/scripts/screens.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd screens && zip -q ../screens-${{ inputs.device }}.zip *.png && cd ..
          gh release delete screenshots-${{ inputs.device }} -y --cleanup-tag || true
          gh release create screenshots-${{ inputs.device }} screens/*.png screens-${{ inputs.device }}.zip \
            --title "Скриншоты (${{ inputs.device }})" --notes "Скриншоты для карточки в магазине." --prerelease
